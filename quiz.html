<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velour Pulse Quiz - Discover Your Archetype</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --plum: #3C2060;
            --purple: #9B6DC9;
            --orchid: #C49BE8;
            --pink: #D4537E;
            --blush: #ED93B1;
            --whisper: #F5EEF8;
            --midnight: #2C2C2A;
            --white: #FFFFFF;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--midnight);
            color: var(--white);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
            display: none;
            flex-direction: column;
            justify-content: center;
        }
        .quiz-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .quiz-logo {
            font-size: 18px;
            font-weight: 500;
            color: var(--orchid);
            margin-bottom: 20px;
        }
        .quiz-logo span { color: var(--pink); }
        .quiz-progress {
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
        }
        .progress-bar {
            height: 4px;
            background: #2a2a28;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--pink), var(--orchid));
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .quiz-chapter {
            font-size: 11px;
            letter-spacing: 0.12em;
            color: var(--orchid);
            text-transform: uppercase;
            margin-bottom: 12px;
            opacity: 0.8;
        }
        .quiz-part {
            font-size: 12px;
            color: #888;
            margin-bottom: 16px;
        }
        .quiz-question {
            font-size: 20px;
            font-weight: 500;
            color: var(--white);
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .quiz-subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 24px;
        }
        .scale-options {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 32px;
        }
        .scale-btn {
            padding: 12px 8px;
            border: 1px solid #3a3a38;
            border-radius: 8px;
            background: transparent;
            color: #aaa;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .scale-btn:hover {
            border-color: var(--pink);
            color: var(--white);
            background: rgba(212, 83, 126, 0.08);
        }
        .scale-btn.selected {
            border-color: var(--pink);
            background: rgba(212, 83, 126, 0.15);
            color: var(--white);
        }
        .scale-label {
            font-size: 10px;
            margin-top: 4px;
            opacity: 0.7;
        }
        .scale-legend {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #666;
            margin-bottom: 12px;
        }
        .nav-buttons {
            display: flex;
            gap: 12px;
            margin-top: 40px;
        }
        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-back {
            background: transparent;
            border: 1px solid #3a3a38;
            color: #aaa;
        }
        .btn-back:hover:not(:disabled) {
            border-color: var(--orchid);
            color: var(--orchid);
        }
        .btn-back:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .btn-next {
            background: var(--pink);
            color: var(--white);
        }
        .btn-next:hover:not(:disabled) {
            opacity: 0.88;
            transform: translateY(-1px);
        }
        .btn-next:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .completion-time {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 20px;
        }
        /* EMAIL MODAL STYLES */
        .email-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .email-modal.hidden {
            display: none;
        }
        .email-modal-content {
            background: #1a1a18;
            border: 0.5px solid #3a3a38;
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .email-logo {
            font-size: 18px;
            font-weight: 500;
            color: var(--orchid);
            margin-bottom: 8px;
        }
        .email-logo span {
            color: var(--pink);
        }
        .email-modal h2 {
            font-size: 24px;
            color: var(--white);
            margin-bottom: 12px;
            margin-top: 12px;
        }
        .email-subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 32px;
        }
        .email-form {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .email-form input {
            width: 100%;
            padding: 12px;
            border: 1px solid #3a3a38;
            border-radius: 8px;
            background: #222220;
            color: var(--white);
            font-size: 14px;
            margin-bottom: 16px;
        }
        .email-form input:focus {
            outline: none;
            border-color: var(--pink);
        }
        .email-submit {
            width: 100%;
            padding: 12px;
            background: var(--pink);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .email-submit:hover:not(:disabled) {
            opacity: 0.88;
        }
        .email-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .email-terms {
            font-size: 12px;
            color: #666;
            margin-top: 16px;
            line-height: 1.5;
        }
        .email-terms a {
            color: var(--orchid);
            text-decoration: none;
        }
        .email-terms a:hover {
            text-decoration: underline;
        }
        .email-divider {
            margin: 24px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #555;
            font-size: 12px;
        }
        .email-divider::before,
        .email-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #3a3a38;
        }
        .email-recover {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #3a3a38;
            border-radius: 8px;
            color: var(--orchid);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
        }
        .email-recover:hover {
            border-color: var(--orchid);
            background: rgba(196, 155, 232, 0.08);
        }
        .email-recover:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        @media(max-width: 768px) {
            .quiz-container { padding: 30px 16px; }
            .quiz-question { font-size: 18px; }
            .scale-options { grid-template-columns: repeat(7, 1fr); gap: 4px; }
            .scale-btn { padding: 10px 4px; font-size: 11px; }
            .email-modal-content { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <!-- EMAIL COLLECTION MODAL -->
    <div id="emailModal" class="email-modal">
        <div class="email-modal-content">
            <div class="email-logo">Velour <span>Pulse</span></div>
            <h2>Before we begin...</h2>
            <p class="email-subtitle">We'll use this to save your results</p>

            <form id="emailForm" class="email-form">
                <input
                    type="email"
                    id="emailInput"
                    name="email"
                    placeholder="your@email.com"
                    required
                    autocomplete="email"
                >
                <button type="submit" class="email-submit">Start Quiz</button>
            </form>

            <div class="email-divider">
                <span>or</span>
            </div>

            <button type="button" id="recoverBtn" class="email-recover">
                Recover My Results
            </button>

            <p class="email-terms">
                By continuing, you agree to our <a href="privacy-policy.html" target="_blank">Privacy Policy</a>
            </p>
        </div>
    </div>

    <div class="quiz-container">
        <div class="quiz-header">
            <div class="quiz-logo">Velour <span>Pulse</span></div>
            <div class="quiz-progress"><span id="currentQ">1</span> of <span id="totalQ">20</span></div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="completion-time">Takes about 5-7 minutes</div>
        </div>

        <div id="quizContent"></div>
    </div>

    <script src="/js/question-framework.js"></script>
    <script src="/js/scoring-engine.js"></script>
    <script src="/js/api-integration.js"></script>
    <script src="/js/quiz-submission.js"></script>
    <script>
        /**
         * EMAIL COLLECTION HANDLER
         */
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('emailInput').value.trim();

            // Validate email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('emailInput').style.borderColor = '#e74c3c';
                return;
            }

            // Save email to localStorage
            localStorage.setItem('vp_user_email', email);

            // Create session if doesn't exist
            let sessionId = localStorage.getItem('vp_session_id');
            if (!sessionId) {
                sessionId = 'session_' + Date.now();
                localStorage.setItem('vp_session_id', sessionId);
            }

            console.log('✓ Email collected:', email);

            // Hide email modal and show quiz
            document.getElementById('emailModal').classList.add('hidden');

            // Initialize quiz
            initializeQuiz();
        });

        /**
         * RECOVERY BUTTON HANDLER
         */
        document.getElementById('recoverBtn').addEventListener('click', async () => {
            const email = document.getElementById('emailInput').value.trim();

            if (!email) {
                alert('Please enter your email to recover results');
                return;
            }

            const submitBtn = document.getElementById('recoverBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Searching...';

            try {
                const session = await API.getSessionByEmail(email);

                if (session.success && session.found) {
                    console.log('✓ Session recovered');
                    // Save recovered session to localStorage
                    localStorage.setItem('vp_session_id', session.sessionId);
                    localStorage.setItem('vp_user_email', session.email);

                    if (session.isPremiumPaid) {
                        localStorage.setItem('vp_premium_unlocked', 'true');
                        localStorage.setItem('vp_premium_email', session.email);
                    }

                    // Redirect to appropriate results page
                    if (session.hasPremiumResults) {
                        window.location.href = '/results-full.html';
                    } else if (session.hasFreeResults) {
                        window.location.href = '/results-free.html';
                    } else {
                        alert('No previous results found. Starting new quiz.');
                        localStorage.setItem('vp_user_email', email);
                        document.getElementById('emailModal').classList.add('hidden');
                        initializeQuiz();
                    }
                } else {
                    alert('Could not find results for this email. Try starting a new quiz.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Recover My Results';
                }
            } catch (error) {
                console.error('Recovery error:', error);
                alert('Could not find results for this email. Try starting a new quiz.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Recover My Results';
            }
        });

        /**
         * Check if email already exists (returning user in same session)
         */
        function checkExistingEmail() {
            const email = localStorage.getItem('vp_user_email');
            if (email) {
                console.log('✓ Email found in session:', email);
                document.getElementById('emailModal').classList.add('hidden');
                initializeQuiz();
            }
        }

        /**
         * Initialize quiz after email is collected
         */
        function initializeQuiz() {
            // Show quiz container
            document.querySelector('.quiz-container').style.display = 'flex';
            renderPage(0);
        }

        // Run email check on page load
        document.addEventListener('DOMContentLoaded', checkExistingEmail);

        // FREE QUIZ: Questions 1-20 only - BATCHED BY CATEGORY (3-4 per page)
        const quizQuestions = freeQuizQuestions;
        let userAnswers = {};

        if (localStorage.getItem('vp_free_answers')) {
            userAnswers = JSON.parse(localStorage.getItem('vp_free_answers'));
        }

        // GROUP QUESTIONS BY CATEGORY - 3-4 questions per page
        function createQuestionPages(questions) {
            const pages = [];
            let currentPage = [];
            let currentCategory = null;

            questions.forEach((q) => {
                const isNewCategory = q.part !== currentCategory;
                const pageIsFull = currentPage.length >= 4;
                const shouldStartNewPage = pageIsFull || (isNewCategory && currentPage.length >= 3);

                if (shouldStartNewPage && currentPage.length > 0) {
                    pages.push([...currentPage]);
                    currentPage = [];
                }

                currentPage.push(q);
                if (isNewCategory) {
                    currentCategory = q.part;
                }
            });

            if (currentPage.length > 0) {
                pages.push(currentPage);
            }

            return pages;
        }

        const quizPages = createQuestionPages(quizQuestions);
        let currentPageIndex = 0;

        document.getElementById('totalQ').textContent = quizQuestions.length;

        function renderPage(pageIndex) {
            const page = quizPages[pageIndex];
            const container = document.getElementById('quizContent');
            const firstQuestionNum = quizQuestions.indexOf(page[0]) + 1;
            const lastQuestionNum = quizQuestions.indexOf(page[page.length - 1]) + 1;
            const percentage = (lastQuestionNum / quizQuestions.length) * 100;

            document.getElementById('currentQ').textContent = lastQuestionNum;
            document.getElementById('progressFill').style.width = percentage + '%';

            const allAnswered = page.every(q => userAnswers[q.id] !== undefined);

            let html = `
                <div class="quiz-chapter">Page ${pageIndex + 1} of ${quizPages.length}</div>
                <div class="quiz-part">Questions ${firstQuestionNum}-${lastQuestionNum} of ${quizQuestions.length}</div>
            `;

            page.forEach((question, idx) => {
                html += `
                    <div style="margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid #3a3a38;">
                        <h2 class="quiz-question" style="font-size: 18px; margin-bottom: 8px;">
                            ${idx + 1}. ${question.text}
                        </h2>
                        <div class="quiz-subtitle">Rate your agreement</div>
                        <div class="scale-legend">
                            <span>Strongly Disagree</span>
                            <span>Neutral</span>
                            <span>Strongly Agree</span>
                        </div>
                        <div class="scale-options" id="scales${question.id}">
                `;

                for (let i = 1; i <= 7; i++) {
                    const selected = userAnswers[question.id] === i ? 'selected' : '';
                    html += `<button class="scale-btn ${selected}" onclick="selectAnswer(${question.id}, ${i})" aria-label="Rating ${i}"></button>`;
                }

                html += `</div></div>`;
            });

            html += `
                <div class="nav-buttons">
                    <button class="btn btn-back" onclick="previousPage()" ${pageIndex === 0 ? 'disabled' : ''}>← Back</button>
                    <button class="btn btn-next" onclick="nextPage()" ${!allAnswered ? 'disabled' : ''}>
                        ${pageIndex === quizPages.length - 1 ? 'View Your Free Results' : 'Next →'}
                    </button>
                </div>
            `;

            container.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function selectAnswer(questionId, value) {
            userAnswers[questionId] = value;
            localStorage.setItem('vp_free_answers', JSON.stringify(userAnswers));

            document.querySelectorAll(`#scales${questionId} .scale-btn`).forEach(btn => btn.classList.remove('selected'));
            event.target.closest('.scale-btn').classList.add('selected');

            const page = quizPages[currentPageIndex];
            const allAnswered = page.every(q => userAnswers[q.id] !== undefined);
            document.querySelector('.btn-next').disabled = !allAnswered;
        }

        async function nextPage() {
            const page = quizPages[currentPageIndex];
            if (!page.every(q => userAnswers[q.id] !== undefined)) {
                alert('Please answer all questions before continuing');
                return;
            }

            if (currentPageIndex < quizPages.length - 1) {
                currentPageIndex++;
                renderPage(currentPageIndex);
            } else {
                try {
                    const result = await QuizSubmission.submitFreeQuiz(userAnswers);
                    if (result.success) {
                        window.location.href = '/results-free.html?session=' + result.sessionId;
                    } else {
                        alert('Error saving answers: ' + result.error);
                    }
                } catch (error) {
                    console.error('Quiz submission error:', error);
                    localStorage.setItem('vp_free_answers', JSON.stringify(userAnswers));
                    window.location.href = '/results-free.html';
                }
            }
        }

        function previousPage() {
            if (currentPageIndex > 0) {
                currentPageIndex--;
                renderPage(currentPageIndex);
            }
        }

        // Render first page
        renderPage(0);
    </script>
</body>
</html>
